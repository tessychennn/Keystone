<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7EBF3">
<title>Keystone</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="warn" id="storeWarn" hidden>
  這個瀏覽器不讓網站存資料，所以關掉分頁後紀錄會消失。
</div>

<div class="app" id="app" data-view="cal">
  <header class="masthead">
    <div class="brand">
      <span class="eyebrow">每週時間帳</span>
      <h1>Keystone</h1>
    </div>

  <nav class="tabs" role="tablist" aria-label="切換模式">
    <button class="tab on" data-view="cal" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      週曆
    </button>
    <button class="tab" data-view="note" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 4h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v5h5M8 13h8M8 17h5"/></svg>
      筆記 <span class="cnt" id="tabCount"></span>
    </button>
  </nav>
  <button class="gear" id="gearBtn" aria-label="設定與備份" aria-expanded="false" aria-controls="tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  </header>

  <!-- ── 週曆 ───────────────────────────── -->
  <div class="view on" id="view-cal" role="tabpanel">
    <div class="vhead">
      <span class="mark"></span>
      <div>
        <h2>週曆</h2>
        <p>選項目、在格子上拖出實際花掉的時間</p>
      </div>
      <span class="rule"></span>
    </div>

    <div class="calbar">
      <div class="wkblock">
        <span class="wkdate" id="weekLabel">—</span>
        <div class="wknav">
          <button class="nbtn ico" id="prevWeek" aria-label="上一週">‹</button>
          <button class="nbtn" id="thisWeek">本週</button>
          <button class="nbtn ico" id="nextWeek" aria-label="下一週">›</button>
        </div>
      </div>
      <div class="totals">
        <div class="stat done"><b class="num" id="doneTotal">0</b><span>已記錄</span></div>
        <div class="stat" id="planStat"><b class="num" id="planTotal">0</b><span>已分配</span></div>
        <div class="stat"><input class="budget-in num" id="budgetVal" type="number" min="1" max="168" step="1" aria-label="本週可分配總時數"><span>總時數</span></div>
      </div>
    </div>

    <div class="railbox" id="railBox"></div>

    <div class="cols">
      <div class="cside">
      <aside class="card fcard tcard" id="taskCard">
        <h3 id="taskHead">項目 <i class="dk">點一下選取，雙擊改名</i><i class="mb" id="taskSum"></i></h3>
        <div class="fbody">
        <div id="taskList"></div>
        <button class="sortbtn" id="sortBtn">調整順序</button>
        <div class="addrow">
          <div class="fld t"><input type="text" id="newName" placeholder="新增項目" maxlength="16"></div>
          <div class="fld h"><input type="number" id="newHours" placeholder="時" min="0" max="80" step="0.5"></div>
          <button class="go" id="addTask">加入</button>
        </div>
        <div class="note-armed idle" id="armedNote"></div>
        <div class="rangerow">
          顯示
          <select id="startSel" aria-label="起始時間"></select>
          —
          <select id="endSel" aria-label="結束時間"></select>
        </div>
        </div>
        <div class="tools" id="tools">
          <button id="copyBtn">複製本週摘要</button>
          <button id="clearBtn">清空本週紀錄</button>
          <button id="exportBtn">匯出備份</button>
          <button id="importBtn">讀入備份</button>
          <button id="syncBtn">設定雲端同步</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </aside>

      <aside class="card fcard dcard" id="todoCard">
        <h3 id="todoHead">今日待辦 <i id="todoDate"></i></h3>
        <div class="fbody">
        <div id="todoList"></div>
        <div class="addrow">
          <div class="fld t"><input type="text" id="newTodo" placeholder="開工要記得做的事" maxlength="40"></div>
          <button class="go" id="addTodo">加入</button>
        </div>
        <div class="tmode">
          <span>新增為</span>
          <button class="modebtn on" data-once="0">每天</button>
          <button class="modebtn" data-once="1">只有明天</button>
        </div>
        </div>
      </aside>
      </div>

      <section class="card">
        <h3>本週 <i>拖曳長度＝時數</i></h3>
        <div class="calwrap" id="calWrap">
          <div class="cal" id="cal">
            <div class="calhead" id="calHead"></div>
            <div class="calbody" id="calBody"></div>
          </div>
        </div>
        <div class="swipehint">← 左右滑動看完整一週 →</div>
      </section>
    </div>
  </div>

  <!-- ── 筆記 ───────────────────────────── -->
  <div class="view" id="view-note" role="tabpanel">
    <div class="vhead">
      <span class="mark"></span>
      <div>
        <h2>筆記</h2>
        <p id="noteMeta">隨時記下來的地方，分類自己管</p>
      </div>
      <span class="rule"></span>
    </div>

    <div class="notewrap">
      <aside class="card">
        <h3 id="noteFormHead">新增筆記</h3>
        <div class="editing-flag" id="editFlag" style="display:none"></div>
        <div class="nf">
          <label for="nTitle">標題</label>
          <div class="fld"><input type="text" id="nTitle" placeholder="這則筆記在講什麼" maxlength="60"></div>
        </div>
        <div class="nf">
          <label for="nCat">分類</label>
          <div class="fld pick">
            <select id="nCat"></select>
            <button class="catdot" id="nDot" aria-label="管理分類" aria-expanded="false" title="管理分類">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 4.5l3 3L8 19l-4 1 1-4z"/></svg>
            </button>
          </div>

          <div class="catpanel" id="catPanel" hidden>
            <div class="cphead">管理分類<i>改名、換色、刪除</i></div>
            <div id="catList"></div>
            <div class="addrow">
              <div class="fld t"><input type="text" id="newCat" placeholder="新增分類" maxlength="12"></div>
              <button class="go" id="addCat">加入</button>
            </div>
            <button class="cpdone" id="catDone">完成</button>
          </div>
        </div>
        <div class="nf">
          <label for="nBody">內容</label>
          <div class="fld"><textarea id="nBody" placeholder="想記下來的細節、卡住的地方、下次要改什麼⋯"></textarea></div>
        </div>
        <div class="nactions">
          <button class="go" id="nSave">儲存筆記</button>
          <button class="ghostbtn" id="nCancel" style="display:none">取消</button>
        </div>
      </aside>

      <section>
        <div class="filters" id="noteFilters"></div>
        <div class="nlist" id="noteList"></div>
      </section>
    </div>
  </div>
</div>

<nav class="dock" aria-label="切換模式">
  <div class="inner">
    <button data-view="cal" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      週曆
    </button>
    <button data-view="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 4h11l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v5h5M8 13h8M8 17h5"/></svg>
      筆記 <span class="cnt" id="dockCount"></span>
    </button>
  </div>
</nav>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
